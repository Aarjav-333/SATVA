# SATVA Node MQTT broker.
#
# Anonymous access is enabled because this broker is only reachable inside the
# compose network and the ingestion endpoint behind it requires a node token.
# A deployment exposing the broker to real field hardware must enable
# per-device credentials and TLS; see docs/known_limitations.md.
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
