[project]
name = "satva-backend"
version = "0.1.0"
description = "SATVA — Scan · Analyse · Trace · Verify · Alert. Backend services."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["integration: requires a live PostgreSQL/PostGIS database"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"scripts/seed_demo.py" = ["S311"]
