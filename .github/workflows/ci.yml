name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app tests scripts

      - name: Test
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing

      # The colorimetry engine exists twice, in Python and in Dart. If the
      # generated golden vectors differ from what is committed, the two
      # implementations are about to disagree about a number that may end up on
      # someone's complaint. Fail rather than let that merge.
      - name: Golden vectors are current
        working-directory: backend
        run: |
          python scripts/generate_golden_vectors.py
          git diff --exit-code ../docs/colorimetry/golden_vectors.json \
            || (echo "::error::Golden vectors are stale. Regenerate and commit them." && exit 1)

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PostGIS and pgvector together; no official image ships both.
      - name: Build the database image
        run: docker build -t satva/postgis-pgvector:16 ./infrastructure/postgres

      - name: Start it
        run: |
          docker run -d --name satva-test-db \
            -e POSTGRES_USER=satva -e POSTGRES_PASSWORD=satva -e POSTGRES_DB=satva \
            -p 5432:5432 satva/postgis-pgvector:16
          for i in $(seq 1 30); do
            docker exec satva-test-db pg_isready -U satva && break
            sleep 2
          done
          docker exec satva-test-db psql -U satva -d satva \
            -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Migrate up, down, and up again
        working-directory: backend
        env:
          SATVA_DATABASE_URL: postgresql+psycopg://satva:satva@localhost:5432/satva
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: The database-level safeguards must actually hold
        env:
          PGPASSWORD: satva
        run: |
          echo "--- custody events must be append-only ---"
          docker exec satva-test-db psql -U satva -d satva -c \
            "UPDATE analytics.custody_events SET actor_kind='x';" 2>&1 | grep -q "append-only" \
            && echo "OK: UPDATE rejected" || (echo "FAIL: UPDATE was permitted" && exit 1)

          echo "--- the analytics role must not reach identity data ---"
          docker exec -e PGPASSWORD=satva_analytics_password satva-test-db \
            psql -U satva_analytics -d satva -c "SELECT 1 FROM identity.users;" 2>&1 \
            | grep -q "permission denied" \
            && echo "OK: identity schema denied" || (echo "FAIL: identity was readable" && exit 1)

      - name: Stop
        if: always()
        run: docker rm -f satva-test-db || true

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-pub

      # Checks the Dart engine against the same golden vectors the Python
      # reference is tested on.
      - name: Test
        working-directory: mobile
        run: flutter test

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        working-directory: dashboard
        run: npm ci

      - name: Lint
        working-directory: dashboard
        run: npx eslint src --ext js,jsx --max-warnings 0

      - name: Build
        working-directory: dashboard
        run: npm run build

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        run: |
          cp .env.example .env
          docker compose config --quiet && echo "compose configuration is valid"
