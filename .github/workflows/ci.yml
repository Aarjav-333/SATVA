name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app tests scripts

      - name: Test
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing

      # The colorimetry engine exists twice, in Python and in Dart. If the
      # generated golden vectors differ from what is committed, the two
      # implementations are about to disagree about a number that may end up on
      # someone's complaint. Fail rather than let that merge.
      - name: Golden vectors are current
        working-directory: backend
        run: |
          python scripts/generate_golden_vectors.py
          git diff --exit-code ../docs/colorimetry/golden_vectors.json \
            || (echo "::error::Golden vectors are stale. Regenerate and commit them." && exit 1)

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PostGIS and pgvector together; no official image ships both.
      - name: Build the database image
        run: docker build -t satva/postgis-pgvector:16 ./infrastructure/postgres

      - name: Start it
        run: |
          # Mount the real init directory rather than restating the extension
          # list here. Hand-copying it meant CI validated migrations against a
          # database that differed from the one compose builds -- the script
          # also creates postgis_topology and pg_trgm, so a migration using
          # either would pass locally and fail here, or the reverse.
          docker run -d --name satva-test-db \
            -e POSTGRES_USER=satva -e POSTGRES_PASSWORD=satva -e POSTGRES_DB=satva \
            -v "$PWD/infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro" \
            -p 5432:5432 satva/postgis-pgvector:16
          # Wait over TCP, not the Unix socket. While initdb runs, the
          # entrypoint starts a temporary server that listens on the socket
          # only, so a socket-based pg_isready reports ready while the init
          # scripts above are still running. TCP opens only once the real
          # server starts, which is after they have all completed.
          #
          # Budget generously: this covers the whole PostGIS bootstrap on a cold
          # runner, and an over-budget init is now a hard failure rather than a
          # step that limps on to a confusing error.
          for i in $(seq 1 60); do
            docker exec satva-test-db pg_isready -U satva -h 127.0.0.1 && break
            sleep 2
          done
          docker exec satva-test-db pg_isready -U satva -h 127.0.0.1
          # Prove the mounted script actually ran; a silent init failure would
          # otherwise only surface as a confusing migration error.
          docker exec satva-test-db psql -U satva -d satva -tAc \
            "SELECT extname FROM pg_extension ORDER BY extname"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Migrate up, down, and up again
        working-directory: backend
        env:
          SATVA_DATABASE_URL: postgresql+psycopg://satva:satva@localhost:5432/satva
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: The database-level safeguards must actually hold
        # `shell: bash` rather than the default `bash -e`, for pipefail: a
        # pipeline must not report success on the strength of its last stage
        # alone. Both probes below therefore capture psql's output and check it
        # explicitly, so "the database was unreachable" can never be printed as
        # "the guarantee was lost" -- the two need different responses.
        shell: bash
        run: |
          # Every psql below runs inside the container, where the image's pg_hba
          # trusts local socket connections. There is deliberately no PGPASSWORD
          # in the step env: docker exec does not forward runner environment, so
          # setting it there only creates the illusion of authentication. The
          # analytics probe passes its own with `docker exec -e`.

          # Asserts that `mutate` is refused by the append-only trigger. The
          # guard is FOR EACH ROW, so it only fires on a row that actually
          # exists: against the empty table a fresh migration leaves behind,
          # "UPDATE ... SET" reports UPDATE 0 and proves nothing. So seed a lot
          # and an event first, then roll the probe back so the assertion leaves
          # no trace in the database.
          #
          # Fixture values must not contain the string the assertion greps for,
          # or the seed itself could satisfy the check and it would pass even
          # with the trigger dropped.
          assert_rejected() {
            local label="$1" mutate="$2" out status=0
            # `|| status=$?` keeps errexit from killing the function here: a
            # failing command substitution in a bare assignment aborts the whole
            # step, which would skip the diagnostic below and leave the log
            # showing nothing at all. psql itself exits 0 even when a statement
            # errors, so a non-zero status means docker/connection, not the
            # trigger firing.
            out=$(docker exec -i satva-test-db psql -U satva -d satva <<SQL 2>&1
          BEGIN;
          INSERT INTO analytics.lots
            (id, lot_code, qr_token, crop, declared_ripening_method, quantity_kg, status, event_count)
          VALUES
            ('00000000-0000-0000-0000-0000000000aa', 'CI-TRIGGER-PROBE', 'ci-trigger-probe-token',
             'banana', 'NONE', 1, 'ACTIVE', 0);
          INSERT INTO analytics.custody_events
            (id, lot_id, sequence_no, event_type, actor_kind, payload,
             occurred_at, previous_hash, event_hash, hash_algorithm)
          VALUES
            ('00000000-0000-0000-0000-0000000000bb', '00000000-0000-0000-0000-0000000000aa',
             0, 'HARVEST', 'SYSTEM', '{}'::jsonb, now(), '0', 'ci-probe-hash', 'sha256');
          $mutate
          ROLLBACK;
          SQL
            ) || status=$?
            if [ "$status" -ne 0 ]; then
              echo "FAIL: could not reach the database to test $label (psql exit $status)"
              echo "$out"
              return 1
            fi
            if printf '%s' "$out" | grep -q "append-only"; then
              echo "OK: $label rejected"
            else
              echo "FAIL: $label was permitted"
              echo "$out"
              return 1
            fi
          }

          echo "--- custody events must be append-only ---"
          assert_rejected UPDATE \
            "UPDATE analytics.custody_events SET actor_kind='x' WHERE id='00000000-0000-0000-0000-0000000000bb';"
          assert_rejected DELETE \
            "DELETE FROM analytics.custody_events WHERE id='00000000-0000-0000-0000-0000000000bb';"

          echo "--- the analytics role must not reach identity data ---"
          # Captured rather than piped: psql exits non-zero here by design (the
          # query is supposed to be refused), so under pipefail a pipe into grep
          # would take psql's status and report a denied read as a failure.
          identity_out=$(docker exec -e PGPASSWORD=satva_analytics_password satva-test-db \
            psql -U satva_analytics -d satva -c "SELECT 1 FROM identity.users;" 2>&1 || true)
          if printf '%s' "$identity_out" | grep -q "permission denied"; then
            echo "OK: identity schema denied"
          else
            echo "FAIL: identity was readable, or the probe never reached the database"
            echo "$identity_out"
            exit 1
          fi

      - name: Stop
        if: always()
        run: docker rm -f satva-test-db || true

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-pub

      # Checks the Dart engine against the same golden vectors the Python
      # reference is tested on.
      - name: Test
        working-directory: mobile
        run: flutter test

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        working-directory: dashboard
        run: npm ci

      - name: Lint
        working-directory: dashboard
        run: npx eslint src --ext js,jsx --max-warnings 0

      - name: Build
        working-directory: dashboard
        run: npm run build

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        run: |
          cp .env.example .env
          docker compose config --quiet && echo "compose configuration is valid"
